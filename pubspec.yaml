name: kinderkids
description: KinderKids - a play, learn & dance app for kids.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  google_fonts: ^6.2.1
  smooth_page_indicator: ^2.0.1
  lottie: ^3.3.1
  audioplayers: 6.1.0
  video_player: ^2.9.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/coloring/
    - assets/data/
    - assets/loties/
    - assets/audios/
    - assets/vedios/
    - assets/data/numbers.json
